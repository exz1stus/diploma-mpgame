[workspace]
members = ["crates/client", "crates/server", "crates/shared", "crates/worldgen"]
resolver = "3"

# Bevy systems take many params and nested query filters by design.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["debug"] }
bevy_ecs = "0.19"
bevy_renet = "5.0"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.229"
avian2d = { version = "0.7", default-features = false, features = [
    "2d",
    "parry-f32",
] }

# Bevy, avian and noise are unusably slow unoptimized; keep game crates quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Terrain generation is all hot noise sampling.
[profile.dev.package.worldgen]
opt-level = 3
