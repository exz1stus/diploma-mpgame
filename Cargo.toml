[workspace]
members = ["crates/client", "crates/server", "crates/shared"]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["debug"] }
bevy_ecs = "0.19"
bevy_renet = "5.0"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.229"
avian2d = { version = "0.7", default-features = false, features = [
    "2d",
    "parry-f32",
] }
