[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_egui = "0.42"
egui_plot = "0.37"
bevy = { workspace = true, features = ["2d"] }
bevy_renet.workspace = true
postcard.workspace = true
serde.workspace = true
ron = "0.12"
avian2d.workspace = true
shared = { path = "../shared" }

[dev-dependencies]
# Validates terrain.wgsl in tests; the same naga version Bevy uses.
naga = { version = "29", features = ["wgsl-in"] }

[lints]
workspace = true
